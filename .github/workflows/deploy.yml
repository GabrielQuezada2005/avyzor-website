# =============================================================================
# Deploy – Production-Deployment nach erfolgreicher CI
# =============================================================================
#
# Zweck:
#   Deployt nur dann nach Vercel (Production), wenn der CI-Workflow auf
#   main/master erfolgreich abgeschlossen wurde.
#
# Voraussetzungen (GitHub Repository Secrets):
#   VERCEL_TOKEN        – Vercel Personal Access Token
#   VERCEL_ORG_ID       – Vercel Team/Org ID
#   VERCEL_PROJECT_ID   – Vercel Project ID
#
# Einrichtung:
#   1. Secrets unter Settings → Secrets and variables → Actions hinterlegen
#   2. Environment "production" optional mit Reviewern schützen
#   3. Branch Protection: "Require status checks" → alle CI-Jobs aktivieren
#
# Hinweis:
#   Wenn Vercel bereits per Git-Integration deployt, dort „Wait for GitHub
#   Checks" aktivieren und Auto-Deploy an CI koppeln (siehe workflows/README.md).
#
# =============================================================================

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy-production:
    name: Deploy to Vercel (Production)
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    timeout-minutes: 20
    environment:
      name: production

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Vercel CLI installieren
        run: npm install --global vercel@latest

      - name: Vercel Production-Umgebung laden
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Vercel Production Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Vercel Production Deploy
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $DEPLOY_URL"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deployment-Zusammenfassung
        run: |
          echo "### Production Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`${{ github.event.workflow_run.head_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **URL:** ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Auslöser:** CI erfolgreich abgeschlossen" >> "$GITHUB_STEP_SUMMARY"

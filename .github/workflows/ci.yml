# =============================================================================
# CI – Qualitätsprüfung bei jedem Push und Pull Request
# =============================================================================
#
# Zweck:
#   Stellt sicher, dass jede Änderung lint-frei, getestet und build-fähig ist,
#   bevor sie gemergt oder deployed werden darf.
#
# Jobs (sequenziell abhängig):
#   1. lint   – ESLint via Next.js
#   2. test   – Vitest (Unit + Integration)
#   3. build  – Production Build (Next.js)
#   4. e2e    – Playwright End-to-End-Tests gegen den Production Build
#
# Deployment:
#   Dieser Workflow blockiert Deployments. Der Deploy-Workflow (.github/workflows/
#   deploy.yml) startet erst nach erfolgreichem Abschluss auf main/master.
#
# =============================================================================

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  NEXT_PUBLIC_SITE_URL: https://avyzor.de
  NEXT_PUBLIC_SITE_NAME: AVYZOR
  NEXT_PUBLIC_SITE_EMAIL: kontakt@avyzor.de

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: ESLint ausführen
        run: npm run lint

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Vitest ausführen
        run: npm run test

      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-reports
          path: tests/reports/vitest-junit.xml
          retention-days: 14
          if-no-files-found: ignore

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 20

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Production Build prüfen
        run: npm run build

      - name: Build-Artefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          retention-days: 1

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Build-Artefakt laden
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next

      - name: Playwright Chromium installieren
        run: npx playwright install --with-deps chromium

      - name: E2E-Tests ausführen
        run: npm run test:e2e
        env:
          CI: true

      - name: E2E-Berichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: |
            tests/reports/playwright-junit.xml
            tests/reports/playwright-html
            test-results
          retention-days: 14
          if-no-files-found: ignore
